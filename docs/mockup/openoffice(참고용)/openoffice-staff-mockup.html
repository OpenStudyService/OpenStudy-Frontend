<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenOffice Staff Mockup</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f6f7fb;--panel:#fff;--line:#e7e9ef;--text:#1f2937;--muted:#6b7280;
  --primary:#4f46e5;--primary-soft:#eef2ff;--sidebar:#151821;--sidebar2:#1e2230;
  --green:#159957;--orange:#d98b00;--red:#dc4d4d;--shadow:0 12px 28px rgba(20,28,45,.08)
}
html,body{margin:0;min-height:100%}
body{font-family:Pretendard,Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
.app{min-height:100vh;display:grid;grid-template-columns:270px 1fr}
.sidebar{background:var(--sidebar);color:#fff;height:100vh;position:sticky;top:0;display:flex;flex-direction:column;z-index:30}
.brand{height:70px;display:flex;align-items:center;gap:11px;padding:0 18px;border-bottom:1px solid #ffffff14}
.logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#6366f1,#8b5cf6);font-weight:900}
.brand b{display:block;font-size:15px}.brand small{display:block;font-size:11px;color:#9199aa;margin-top:2px}
.workspace{margin:13px 12px 6px;padding:12px;border-radius:12px;background:#ffffff0f}
.workspace-row{display:flex;justify-content:space-between;gap:10px;align-items:center}.workspace b{font-size:12px}.workspace small{display:block;font-size:10px;color:#8f97a8;margin-top:3px}
.role-preview{margin-top:11px;padding-top:10px;border-top:1px solid #ffffff12}
.role-preview label{display:block;font-size:9px;font-weight:800;color:#858ea1;margin-bottom:6px;letter-spacing:.05em}
.role-preview select{width:100%;border:1px solid #ffffff16;border-radius:8px;background:#11141d;color:#e7eaf0;padding:8px 9px;font-size:10px;outline:none}
.nav{padding:7px 10px 10px;overflow:auto;flex:1}
.nav-title{font-size:10px;color:#737d90;font-weight:800;letter-spacing:.08em;margin:16px 10px 7px}
.nav button{width:100%;border:0;background:transparent;color:#cbd0da;text-align:left;padding:10px 12px;border-radius:9px;margin:2px 0;cursor:pointer;display:flex;gap:9px;align-items:center}
.nav button:hover,.nav button.on{background:#6366f138;color:#fff}.nav button.hidden{display:none}
.nav .label{flex:1;font-size:12px}.nav .ico{width:20px;text-align:center}
.badge{background:#4f46e5;color:#fff;border-radius:999px;min-width:19px;height:19px;padding:0 5px;display:grid;place-items:center;font-size:9px}
.ai-wrap{padding:0 12px 10px}
.ai-btn{width:100%;border:1px solid #817aff55;background:linear-gradient(135deg,#4f46e526,#8b5cf62a);color:#f1efff;border-radius:11px;padding:11px 12px;display:flex;align-items:center;gap:9px;cursor:pointer;text-align:left}
.ai-btn strong{display:block;font-size:11px}.ai-btn small{display:block;font-size:9px;color:#aaa7cc;margin-top:2px}
.me{padding:13px 14px;border-top:1px solid #ffffff14;display:flex;gap:10px;align-items:center}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#0ea5e9,#4f46e5);display:grid;place-items:center;font-size:11px;font-weight:800}
.me b{display:block;font-size:12px}.me small{display:block;color:#8f97a8;font-size:10px;margin-top:3px}
.main{min-width:0}
.header{height:70px;background:#fffffff2;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:20}
.header-left{display:flex;gap:11px;align-items:center}.hamb{display:none}
.header h1{font-size:18px;margin:0}.header p{font-size:11px;color:var(--muted);margin:4px 0 0}
.header-actions{display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;height:23px;padding:0 8px;border-radius:999px;font-size:9px;font-weight:700;white-space:nowrap}
.chip.green{background:#eaf8ef;color:#16834b}.chip.blue{background:#eef2ff;color:#4f46e5}.chip.orange{background:#fff5df;color:#a96c00}.chip.red{background:#fff0f0;color:#c74646}.chip.gray{background:#f1f2f5;color:#697080}
.content{max-width:1480px;margin:auto;padding:22px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}
.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:0 3px 14px rgba(20,28,45,.035)}
.card h3{font-size:13px;margin:0}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.link{border:0;background:none;color:var(--primary);font-size:10px;font-weight:700;cursor:pointer}
.hero{border-radius:18px;padding:22px;background:linear-gradient(135deg,#22263a,#343a5c);color:#fff;display:grid;grid-template-columns:1.25fr .8fr;gap:18px;box-shadow:var(--shadow)}
.hero h2{font-size:23px;margin:0 0 7px}.hero p{margin:0;color:#ffffffc7;font-size:12px;line-height:1.6}
.hero-panel{background:#ffffff12;border:1px solid #ffffff20;border-radius:14px;padding:15px}.hero-panel small{color:#ffffffb3;font-size:10px}.hero-panel b{display:block;font-size:18px;margin:6px 0 10px}
.hero-row{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid #ffffff1f;font-size:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px}.stat span{font-size:10px;color:var(--muted)}.stat b{font-size:22px;display:block;margin-top:5px}.stat small{font-size:9px;color:#9097a5}
.row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid #f0f1f4}.row:last-child{border-bottom:0}
.rowico{width:36px;height:36px;border-radius:10px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:800;flex:0 0 auto}
.grow{flex:1;min-width:0}.grow b{display:block;font-size:11px}.grow small{display:block;font-size:9px;color:var(--muted);margin-top:4px;line-height:1.45}
.btn{border:0;border-radius:9px;padding:8px 11px;font-size:10px;font-weight:700;cursor:pointer}.primary{background:var(--primary);color:#fff}.ghost{background:#f5f6f8;color:#4b5563;border:1px solid #e4e7ec}.danger{background:#fff0f0;color:#c64646;border:1px solid #ffd8d8}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{border:1px solid #dfe2e9;background:#fff;border-radius:9px;padding:9px 10px}.toolbar input{flex:1;min-width:220px}
.field{margin-bottom:11px}.field label{display:block;font-size:9px;font-weight:700;color:#566071;margin-bottom:5px}.field input,.field select,.field textarea{width:100%}.field textarea{min-height:100px;resize:vertical}
.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:10px;border-bottom:1px solid #eef0f3;font-size:10px}th{background:#fafbfc;color:#737b88;font-weight:700}
.split{display:grid;grid-template-columns:320px 1fr;gap:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#fff;color:#687180;border-radius:8px;padding:7px 10px;font-size:9px;font-weight:700;cursor:pointer}.tab.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.view-switch{display:flex;gap:5px}.view-switch button{border:1px solid var(--line);background:#fff;color:#667085;border-radius:8px;padding:7px 10px;font-size:9px;cursor:pointer}.view-switch button.on{background:#eef2ff;color:#4f46e5;border-color:#cfd4ff;font-weight:800}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line);min-width:850px}
.cal-head,.cal-day{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.cal-head{background:#fafbfc;padding:9px;text-align:center;font-size:9px;font-weight:800;color:#667085}
.cal-day{min-height:108px;padding:8px}.cal-day.muted{background:#fafafa;color:#adb3bd}.cal-date{font-size:9px;font-weight:800;margin-bottom:6px}.cal-event{font-size:8px;line-height:1.35;border-radius:6px;padding:5px 6px;margin:4px 0;background:#eef2ff;color:#4f46e5}.cal-event.room{background:#eaf8ef;color:#16834b}.cal-event.alert{background:#fff5df;color:#9b6500}
.calendar-wrap{overflow:auto}
.floor-summary{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}.floor-stat{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fafbfc}.floor-stat span{font-size:8px;color:var(--muted);display:block}.floor-stat b{font-size:12px;display:block;margin-top:3px}
.seat-map{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}.seat{border:1px solid #dfe2e9;background:#fff;border-radius:9px;padding:11px 5px;text-align:center;font-size:9px}.seat small{display:block;margin-top:4px;font-size:8px;color:#8a92a0}.seat.use{background:#eef2ff;border-color:#cfd4ff;color:#4f46e5}.seat.fixed{background:#f4efff;border-color:#ded0ff;color:#7450bf}.seat.blocked{background:#f4f4f5;color:#9ca3af}
.room-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.room-box{border:1px solid var(--line);border-radius:11px;padding:12px}.room-box b{font-size:10px}.room-box small{font-size:9px;color:var(--muted);display:block;margin-top:5px;line-height:1.4}
.permission-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.permission{border:1px solid var(--line);border-radius:11px;padding:12px}.permission b{font-size:10px;display:block}.permission small{font-size:8px;color:var(--muted);line-height:1.5;display:block;margin-top:5px}
.timeline{display:grid;grid-template-columns:90px 1fr;gap:10px}.time{font-size:9px;color:var(--muted);padding-top:2px}.event{border-left:3px solid var(--primary);padding:0 0 12px 11px}.event b{font-size:10px}.event small{display:block;font-size:9px;color:var(--muted);margin-top:3px}
.overlay{display:none}.toast{position:fixed;right:20px;bottom:20px;background:#171923;color:#fff;padding:11px 14px;border-radius:9px;font-size:10px;opacity:0;transform:translateY(8px);transition:.2s;z-index:60}.toast.show{opacity:1;transform:none}
@media(max-width:1180px){.s8,.s7,.s6,.s5,.s4{grid-column:span 12}.stats{grid-template-columns:repeat(2,1fr)}.permission-grid{grid-template-columns:1fr 1fr}.seat-map{grid-template-columns:repeat(6,1fr)}}
@media(max-width:860px){
  .app{grid-template-columns:1fr}.sidebar{position:fixed;left:0;top:0;width:min(84vw,300px);transform:translateX(-101%);transition:.2s;z-index:40}.sidebar.open{transform:none}
  .overlay.show{display:block;position:fixed;inset:0;background:#0006;z-index:35}.hamb{display:block}.content{padding:14px}.header{padding:0 14px}.hero{grid-template-columns:1fr}.split{grid-template-columns:1fr}.seat-map{grid-template-columns:repeat(4,1fr)}.room-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:520px){.stats{grid-template-columns:1fr 1fr}.header .chip{display:none}.permission-grid,.room-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="logo">O</div><div><b>OpenOffice</b><small>Staff Workspace</small></div></div>

  <div class="workspace">
    <div class="workspace-row"><div><b>을지로 센터</b><small>운영 중 · 08:00–22:00</small></div><span>⌄</span></div>
    <div class="role-preview">
      <label>목업 역할 전환</label>
      <select id="roleSelect">
        <option value="MANAGER">MANAGER</option>
        <option value="STAFF">STAFF</option>
        <option value="SPACE_MANAGER">SPACE_MANAGER</option>
        <option value="FACILITY_MANAGER">FACILITY_MANAGER</option>
        <option value="ADMIN">ADMIN</option>
      </select>
    </div>
  </div>

  <nav class="nav">
    <div class="nav-title">COMMON</div>
    <button class="on" data-page="dashboard" data-perm="dashboard"><span class="ico">⌂</span><span class="label">대시보드</span></button>
    <button data-page="attendance" data-perm="attendance"><span class="ico">◇</span><span class="label">내 근태</span></button>
    <button data-chat="true" data-perm="chat"><span class="ico">#</span><span class="label">직원 채팅</span><span class="badge">5</span></button>

    <div class="nav-title" data-section="operations">ROLE MENU</div>
    <button data-page="members" data-perm="members"><span class="ico">◎</span><span class="label">회원·기업 관리</span></button>
    <button data-page="reservations" data-perm="reservations"><span class="ico">▣</span><span class="label">예약 관리</span><span class="badge">4</span></button>
    <button data-page="spaces" data-perm="spaces"><span class="ico">▦</span><span class="label">공간·좌석 관리</span></button>
    <button data-page="lockers" data-perm="lockers"><span class="ico">▧</span><span class="label">고객사 사물함</span></button>
    <button data-page="parcel" data-perm="parcel"><span class="ico">□</span><span class="label">택배 관리</span><span class="badge">2</span></button>
    <button data-page="inquiries" data-perm="inquiries"><span class="ico">◌</span><span class="label">고객 문의</span><span class="badge">3</span></button>
    <button data-page="notice" data-perm="notice"><span class="ico">#</span><span class="label">공지사항</span></button>

    <div class="nav-title" data-section="admin">ADMIN</div>
    <button data-page="employees" data-perm="employees"><span class="ico">♙</span><span class="label">직원 관리</span></button>
    <button data-page="security" data-perm="security"><span class="ico">⚿</span><span class="label">계정·로그인 이력</span></button>
  </nav>

  <div class="ai-wrap">
    <button class="ai-btn" id="aiBtn">
      <span style="font-size:17px">✦</span>
      <span><strong>AI 업무 도우미</strong><small>운영 정보 요약 · 질의</small></span>
    </button>
  </div>

  <div class="me"><div class="av">SJ</div><div><b>이승준</b><small id="profileRole">MANAGER · 을지로 센터</small></div></div>
</aside>

<div class="overlay" id="overlay"></div>

<main class="main">
<header class="header">
  <div class="header-left"><button class="hamb btn ghost" id="hamb">☰</button><div><h1 id="title">대시보드</h1><p id="sub">오늘의 센터 운영 현황을 확인합니다.</p></div></div>
  <div class="header-actions"><span class="chip green">센터 정상 운영</span></div>
</header>
<div class="content" id="content"></div>
</main>
</div>
<div class="toast" id="toast"></div>

<script>
let role="MANAGER";
let currentPage="dashboard";
let reservationView="calendar";
let floor="3F";

const rolePerms={
  ADMIN:["dashboard","attendance","chat","members","reservations","spaces","lockers","parcel","inquiries","notice","employees","security"],
  MANAGER:["dashboard","attendance","chat","members","reservations","spaces","lockers","parcel","inquiries","notice"],
  STAFF:["dashboard","attendance","chat","reservations","parcel","inquiries"],
  SPACE_MANAGER:["dashboard","attendance","chat","reservations","spaces","lockers"],
  FACILITY_MANAGER:["dashboard","attendance","chat","spaces","lockers"]
};

const info={
  dashboard:["대시보드","오늘의 센터 운영 현황을 확인합니다."],
  members:["회원·기업 관리","회원, 조직, 구독 상태를 조회하고 관리합니다."],
  reservations:["예약 관리","캘린더와 목록에서 좌석·회의실 예약을 관리합니다."],
  spaces:["공간·좌석 관리","층별 좌석과 회의실 상태를 확인합니다."],
  lockers:["고객사 사물함 관리","기업별 사물함 계약과 배정 현황을 관리합니다."],
  parcel:["택배 관리","도착한 택배를 접수하고 수령 상태를 관리합니다."],
  inquiries:["고객 문의","회원 문의를 배정하고 처리 상태를 관리합니다."],
  notice:["공지사항","전체 또는 지점별 공지사항을 작성하고 관리합니다."],
  attendance:["내 근태","내 출퇴근 기록과 오늘 근태 상태를 확인합니다."],
  employees:["직원 관리","직원별 역할과 접근 권한을 부여합니다."],
  security:["계정·로그인 이력","직원 계정 상태와 로그인 이력을 확인합니다."]
};

const chip=(t,c="blue")=>`<span class="chip ${c}">${t}</span>`;
const row=(icon,title,desc,end="")=>`<div class="row"><div class="rowico">${icon}</div><div class="grow"><b>${title}</b><small>${desc}</small></div>${end}</div>`;
const table=(heads,data)=>`<div class="table"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${data.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;

function dashboard(){
  return `<div class="hero">
    <div><h2>을지로 센터 운영 현황</h2><p>오늘의 방문, 예약, 문의, 택배 및 근무 현황을 한눈에 확인합니다.</p></div>
    <div class="hero-panel">
      <small>현재 센터 상태</small><b>정상 운영 중</b>
      <div class="hero-row"><span>현재 입실 회원</span><strong>128명</strong></div>
      <div class="hero-row"><span>오늘 예약</span><strong>37건</strong></div>
      <div class="hero-row"><span>오늘 근무자</span><strong>7명</strong></div>
    </div>
  </div>

  <div class="grid" style="margin-top:14px">
    <div class="s12 stats">
      <div class="stat"><span>현재 입실</span><b>128명</b><small>CHECK_IN_OUT</small></div>
      <div class="stat"><span>오늘 좌석 예약</span><b>14건</b><small>SEAT_RESERVATION</small></div>
      <div class="stat"><span>오늘 회의실 예약</span><b>23건</b><small>ROOM_RESERVATION</small></div>
      <div class="stat"><span>문의 대기</span><b>3건</b><small>INQUIRY</small></div>
    </div>

    <div class="card s8">
      <div class="head"><h3>오늘 예약 현황</h3>${rolePerms[role].includes("reservations")?`<button class="link jump" data-page="reservations">예약 관리</button>`:""}</div>
      ${row("▣","A-301 회의실","14:00–16:00 · 이승준 · 이용 인원 4 / 6명",chip("RESERVED","blue"))}
      ${row("▣","B-204 회의실","15:00–17:00 · 최유정 · 이용 인원 3 / 4명",chip("RESERVED","blue"))}
      ${row("▦","B-18 자유석","10:00–18:00 · 박민수",chip("RESERVED","green"))}
      ${row("▣","S-401 세미나실","18:00–20:00 · NextWorks · 이용 인원 16 / 20명",chip("RESERVED","blue"))}
    </div>

    <div class="card s4">
      <div class="head"><h3>오늘 근무자</h3>${rolePerms[role].includes("attendance")?`<button class="link jump" data-page="attendance">내 근태</button>`:""}</div>
      ${row("MJ","김민지","MANAGER · 08:52 출근",chip("NORMAL","green"))}
      ${row("JH","박준호","FACILITY_MANAGER · 09:03 출근",chip("NORMAL","green"))}
      ${row("YR","최유리","STAFF · 09:21 출근",chip("LATE","orange"))}
      ${row("DK","한도경","SPACE_MANAGER · 08:58 출근",chip("NORMAL","green"))}
    </div>
  </div>`;
}

function members(){
  return `<div class="toolbar"><input placeholder="회원명, 이메일, 조직명 검색"><select><option>전체 상태</option><option>ACTIVE</option><option>INACTIVE</option></select><select><option>개인/기업 전체</option><option>개인 회원</option><option>기업 회원</option></select></div>
  <div class="grid">
    <div class="card s8"><div class="head"><h3>회원 목록</h3></div>
      ${table(["회원","유형","소속","구독","상태","최근 이용"],[

        <div class="time">10:12</div><div class="event"><b>로그인 성공 · 이승준</b><small>Chrome / Windows · 10.0.0.21</small></div>
        <div class="time">09:58</div><div class="event"><b>로그인 실패 · 최유리</b><small>비밀번호 오류 · failed_count 3</small></div>
        <div class="time">09:01</div><div class="event"><b>로그인 성공 · 박준호</b><small>Edge / Windows · 10.0.0.34</small></div>
      </div>
    </div>
  </div>`;
}

const pages={dashboard,members,reservations,spaces,lockers,parcel,inquiries,notice,attendance,employees,security};
const content=document.getElementById("content"),title=document.getElementById("title"),sub=document.getElementById("sub"),toast=document.getElementById("toast");

function show(m){
  toast.textContent=m;toast.classList.add("show");
  clearTimeout(window.tt);window.tt=setTimeout(()=>toast.classList.remove("show"),1600);
}

function bind(){
  document.querySelectorAll(".jump").forEach(b=>b.onclick=()=>go(b.dataset.page));
  document.querySelectorAll(".action").forEach(b=>b.onclick=()=>show(b.dataset.msg));
  document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{reservationView=b.dataset.view;renderCurrent()});
  document.querySelectorAll("[data-floor]").forEach(b=>b.onclick=()=>{floor=b.dataset.floor;renderCurrent()});
}

function visiblePage(page){
  return rolePerms[role].includes(page);
}

function applyPermissions(){
  document.querySelectorAll("[data-perm]").forEach(el=>{
    el.classList.toggle("hidden",!rolePerms[role].includes(el.dataset.perm));
  });
  document.getElementById("profileRole").textContent=`${role} · 을지로 센터`;
}

function renderCurrent(){
  if(!visiblePage(currentPage)) currentPage="dashboard";
  title.textContent=info[currentPage][0];
  sub.textContent=info[currentPage][1];
  content.innerHTML=pages[currentPage]();
  document.querySelectorAll(".nav button[data-page]").forEach(b=>b.classList.toggle("on",b.dataset.page===currentPage));
  bind();
}

function go(p){
  if(!visiblePage(p)){show("현재 역할에는 이 메뉴 접근 권한이 없습니다.");return}
  currentPage=p;renderCurrent();
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("overlay").classList.remove("show");
  window.scrollTo(0,0);
}

document.querySelectorAll(".nav button[data-page]").forEach(b=>b.onclick=()=>go(b.dataset.page));
document.querySelectorAll("[data-chat]").forEach(b=>b.onclick=()=>{
  if(rolePerms[role].includes("chat")) window.location.href="openoffice-staff-chat-mockup.html";
});
document.getElementById("roleSelect").onchange=e=>{
  role=e.target.value;applyPermissions();
  if(!visiblePage(currentPage)) currentPage="dashboard";
  renderCurrent();
  show(`${role} 권한으로 목업을 전환했습니다.`);
};
document.getElementById("aiBtn").onclick=()=>show("AI 업무 도우미 패널을 엽니다.");
document.getElementById("hamb").onclick=()=>{document.getElementById("sidebar").classList.add("open");document.getElementById("overlay").classList.add("show")};
document.getElementById("overlay").onclick=()=>{document.getElementById("sidebar").classList.remove("open");document.getElementById("overlay").classList.remove("show")};

applyPermissions();
renderCurrent();
</script>
</body>
</html>
