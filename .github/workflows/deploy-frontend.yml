name: Frontend CI and S3 deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --test scripts/deploy-static.test.mjs
      - name: Install browser for production build checks
        run: npx playwright install --with-deps chromium
      - name: Verify live and Mock production builds
        run: npm run test:builds
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: frontend-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-${{ github.sha }}
          path: dist
      - name: Check current main revision
        id: revision
        shell: bash
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main --depth=1
          if [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main commit exists. Skip this deployment.'
          fi
      - name: Validate deployment settings
        if: steps.revision.outputs.current == 'true'
        shell: bash
        run: |
          : "${AWS_ACCOUNT_ID:?Set AWS_ACCOUNT_ID}"
          : "${AWS_REGION:?Set AWS_REGION}"
          : "${AWS_DEPLOY_ROLE_ARN:?Set AWS_DEPLOY_ROLE_ARN}"
          : "${S3_BUCKET:?Set S3_BUCKET}"
          : "${CLOUDFRONT_DISTRIBUTION_ID:?Set CLOUDFRONT_DISTRIBUTION_ID}"
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        if: steps.revision.outputs.current == 'true'
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: frontend-${{ github.run_id }}
      - name: Publish and verify
        if: steps.revision.outputs.current == 'true'
        run: bash scripts/deploy-static.sh
